# Market Newsletter Configuration
# Customize newsletter behavior without editing main.py

[NEWS_SETTINGS]
# Number of top articles to analyze
max_articles = 20

# Keywords to search for market news
# Add or remove topics as needed
search_keywords = 
    Federal Reserve interest rates
    bonds fixed income
    stock market S&P 500
    inflation economic data
    central bank policy
    forex currency markets
    emerging markets
    commodity prices oil
    credit spreads yields
    quantitative tightening
    earnings season
    GDP growth
    employment data
    housing market
    corporate debt

[LLM_SETTINGS]
# AI model to use for analysis
# Options: gpt-4, gpt-3.5-turbo, claude-opus, claude-sonnet, claude-haiku
model = claude-3-5-sonnet-20241022

# Maximum tokens for analysis (higher = more detailed, more expensive)
# Typical range: 1500-2500
max_tokens = 2000

# Temperature controls creativity (0 = factual, 1 = creative)
# For financial analysis, lower is better
temperature = 0.5

[EMAIL_SETTINGS]
# Email subject line
subject_prefix = Market Intelligence Brief

# Include market disclaimer
include_disclaimer = true

# HTML email theme
# Options: professional, dark, light
theme = professional

[TRADE_ANALYSIS]
# Should the analysis include specific trade recommendations
include_trade_recommendation = true

# Should include entry/exit points
include_entry_exit = true

# Should include risk/reward analysis
include_risk_reward = true

# Should include position sizing recommendations
include_positioning = true

[API_SETTINGS]
# API request timeout in seconds
request_timeout = 10

# Number of retries for failed API calls
max_retries = 3

# Retry delay in seconds
retry_delay = 2

# Whether to cache recent articles (avoid duplicate analysis)
cache_articles = true

[CONTENT_SETTINGS]
# Tone of analysis: professional, casual, aggressive, conservative
tone = professional

# Focus areas (comma-separated)
# Options: macro, fixed-income, equities, forex, commodities, crypto
focus_areas = macro, fixed-income, equities

# Geographic focus
# Options: global, US-only, emerging-markets, developed-markets
geographic_focus = global

# Whether to compare to previous day/week
compare_to_previous = true

# Minimum confidence level for trade recommendation (%)
min_trade_confidence = 70
